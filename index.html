<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <svg class="brand-logo" viewBox="0 0 24 24" width="24" height="24">
            <rect x="1" y="1" width="22" height="22" rx="6" fill="currentColor"/>
            <path d="M6 7l2.2 10h1.8l2-7 2 7h1.8L18 7h-1.9l-1.3 6.8L12.9 7h-1.8l-1.9 6.8L7.9 7H6z" fill="#000"/>
          </svg>
          <span class="brand-name">Chughli</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="sidebar-item active" id="new-chat-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          New chat
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-cta">
          <p class="cta-title">Chughli</p>
          <p class="cta-desc">Powered by Groq.</p>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar"></header>

      <div class="landing" id="landing-view">
        <h1 class="landing-title">Where should we begin?</h1>

        <div class="chat-input-container">
          <textarea id="chat-input" rows="1" placeholder="Ask anything"></textarea>
          <button class="send-button" id="send-btn" disabled>
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>

      <div class="chat-view" id="chat-view" style="display:none;">
        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input-wrapper">
          <div class="chat-input-container">
            <textarea id="chat-input-2" rows="1" placeholder="Ask anything"></textarea>
            <button class="send-button" id="send-btn-2" disabled>
              <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>

      <p class="footer-note">Chatbot can make mistakes. Check important info.</p>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
