<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wazeer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="noise-overlay"></div>

  <div class="app">

    <!-- Sidebar: conversation history -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-dot"></span>
          <h1>Wazeer</h1>
        </div>
        <button id="sidebar-close" class="icon-btn sidebar-close" type="button" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <button id="new-chat-btn" class="new-chat-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        New chat
      </button>

      <div id="conversation-list" class="conversation-list"></div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

    <!-- Main chat column -->
    <div class="main-col">
      <header class="app-header">
        <button id="sidebar-toggle" class="icon-btn sidebar-toggle" type="button" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <p class="tagline">Powered by Groq</p>
        <button id="clear-btn" class="clear-btn" type="button" aria-label="Clear chat">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 7H20M9 7V4.5C9 4.22386 9.22386 4 9.5 4H14.5C14.7761 4 15 4.22386 15 4.5V7M18 7L17.3 18.3C17.25 19.25 16.45 20 15.5 20H8.5C7.55 20 6.75 19.25 6.7 18.3L6 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Clear
        </button>
      </header>

      <main class="chat-shell">
        <div id="chat-window" class="chat-window">
          <div class="message bot">
            <div class="avatar bot-avatar">W</div>
            <div class="bubble">
              <div class="bubble-text">Hey! I'm Wazeer 👋 Ask me anything and I'll answer at Groq speed.</div>
            </div>
          </div>
        </div>

        <div id="typing-indicator" class="typing-indicator hidden">
          <div class="avatar bot-avatar">W</div>
          <div class="bubble typing-bubble">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div id="attachment-preview" class="attachment-preview hidden"></div>

        <form id="chat-form" class="chat-input-row" autocomplete="off">
          <div class="attach-wrapper">
            <button id="attach-btn" type="button" class="plus-btn" aria-label="Add content">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>

            <div id="attach-menu" class="attach-menu hidden">
              <button type="button" class="attach-item" id="menu-add-files">
                <span class="attach-icon">📎</span> Add files or photos
              </button>
              <button type="button" class="attach-item" id="menu-screenshot">
                <span class="attach-icon">📷</span> Take a screenshot
              </button>
              <button type="button" class="attach-item" id="menu-add-project">
                <span class="attach-icon">📁</span> Add to project
              </button>
              <div class="attach-divider"></div>
              <button type="button" class="attach-item" id="menu-web-search">
                <span class="attach-icon">🌐</span> Web search
                <span class="attach-check" id="web-search-check"></span>
              </button>
            </div>

            <input id="file-input" type="file" accept="image/*,.txt,.md,.csv,.json,.js,.ts,.py,.log,.html,.css,.pdf,.docx" hidden />
          </div>
          <input
            id="chat-input"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
          />
          <button id="send-btn" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
          </button>
        </form>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
