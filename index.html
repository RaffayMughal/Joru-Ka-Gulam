<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wazeer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LIVE VIDEO BACKGROUND -->
  <div class="video-bg-container">
    <video autoplay muted loop playsinline class="video-bg">
      <!-- Free abstract tech/liquid background video -->
      <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-network-lines-2763-large.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Animated background orbs (Now float OVER the video) -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="noise-overlay"></div>

  <div class="app">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-dot"></span>
          <h1>Wazeer</h1>
        </div>
        <button id="sidebar-close" class="icon-btn sidebar-close" type="button" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>

      <button id="new-chat-btn" class="new-chat-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        New chat
      </button>

      <div id="conversation-list" class="conversation-list"></div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

    <!-- Main -->
    <div class="main-col">
      <header class="app-header">

        <button id="sidebar-toggle" class="icon-btn sidebar-toggle"
