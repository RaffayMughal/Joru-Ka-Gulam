<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn logo-btn">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
        </button>
        <button class="icon-btn collapse-btn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="sidebar-item active" id="new-chat-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          New chat
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-cta">
          <p class="cta-title">Chatbot</p>
          <p class="cta-desc">Powered by Groq.</p>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <div class="model-selector">Chatbot</div>
      </header>

      <!-- Landing view: shown before the first message -->
      <div class="landing" id="landing-view">
        <h1 class="landing-title">Where should we begin?</h1>

        <div class="chat-input-container">
          <textarea id="chat-input" rows="1" placeholder="Ask anything"></textarea>
          <button class="send-button" id="send-btn" disabled>
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>

      <!-- Chat view: shown once the conversation starts -->
      <div class="chat-view" id="chat-view" style="display:none;">
        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input-wrapper">
          <div class="chat-input-container">
            <textarea id="chat-input-2" rows="1" placeholder="Ask anything"></textarea>
            <button class="send-button" id="send-btn-2" disabled>
              <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>

      <p class="footer-note">Chatbot can make mistakes. Check important info.</p>
    </main>

  </div>

  <script>
    const landingView = document.getElementById('landing-view');
    const chatView = document.getElementById('chat-view');
    const messagesEl = document.getElementById('chat-messages');

    const inputA = document.getElementById('chat-input');
    const sendA = document.getElementById('send-btn');
    const inputB = document.getElementById('chat-input-2');
    const sendB = document.getElementById('send-btn-2');

    let started = false;

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function wireInput(inputEl, sendEl) {
      inputEl.addEventListener('input', () => {
        autoResize(inputEl);
        sendEl.disabled = inputEl.value.trim().length === 0;
      });
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (inputEl.value.trim().length > 0) sendMessage(inputEl.value.trim());
        }
      });
      sendEl.addEventListener('click', () => {
        if (inputEl.value.trim().length > 0) sendMessage(inputEl.value.trim());
      });
    }

    wireInput(inputA, sendA);
    wireInput(inputB, sendB);

    function addMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = 'message ' + (role === 'user' ? 'user' : 'bot');
      msg.textContent = text;
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return msg;
    }

    async function sendMessage(text) {
      if (!started) {
        started = true;
        landingView.style.display = 'none';
        chatView.style.display = 'flex';
      }

      inputA.value = '';
      inputB.value = '';
      autoResize(inputA);
      autoResize(inputB);
      sendA.disabled = true;
      sendB.disabled = true;

      addMessage('user', text);
      const typingMsg = addMessage('bot', 'Thinking…');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();

        if (data.error) {
          typingMsg.textContent = 'Error: ' + data.error;
        } else {
          typingMsg.textContent = data.reply;
        }
      } catch (err) {
        typingMsg.textContent = 'Error: could not reach the server.';
      }
    }

    document.getElementById('new-chat-btn').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/reset', { method: 'POST' });
      messagesEl.innerHTML = '';
      started = false;
      chatView.style.display = 'none';
      landingView.style.display = 'flex';
    });
  </script>

</body>
</html>
