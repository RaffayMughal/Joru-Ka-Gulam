<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wazeer - AI Assistant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Particles -->
  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- Top Navigation Bar -->
  <nav class="top-bar">
    <button class="icon-btn" id="menu-toggle" title="Open Menu">
      <svg viewBox="0 0 24 24" fill="none" width="22" height="22"><path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    
    <div class="brand-center">
      <div class="brand-logo">W</div>
      <div class="brand-text">
        <span class="brand-name">Wazeer</span>
        <span class="brand-sub">for Badshah</span>
      </div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="theme-btn" title="Toggle Theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" width="20" height="20"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" width="20" height="20" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="notif-btn" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </nav>

  <!-- Slide-out Sidebar -->
  <aside class="slide-sidebar" id="slide-sidebar">
    <div class="sidebar-header">
      <h2>Menu</h2>
      <button class="icon-btn" id="close-sidebar">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    
    <button class="sidebar-btn primary" id="new-chat-btn">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      New Chat
    </button>

    <div class="sidebar-section">
      <h3>Recent Chats</h3>
      <div id="conversation-list" class="conv-list"></div>
    </div>

    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="user-avatar">B</div>
        <div class="user-details">
          <span class="user-name">Badshah</span>
          <span class="user-status">● Online</span>
        </div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main Chat Area -->
  <main class="main-area">
    
    <!-- Welcome Screen -->
    <div class="welcome-screen" id="welcome-screen">
      <div class="welcome-logo">W</div>
      <h1>How can I help you today, Badshah?</h1>
      <p>Ask me anything, upload a file, or start a new conversation.</p>
    </div>

    <!-- Chat Messages -->
    <div class="chat-scroll" id="chat-scroll">
      <div id="chat-window" class="chat-window"></div>
    </div>

    <!-- Typing Indicator -->
    <div id="typing-indicator" class="typing-indicator hidden">
      <div class="avatar bot">W</div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>

    <!-- Attachment Preview -->
    <div id="attachment-preview" class="attachment-preview hidden"></div>

    <!-- Floating Input Bar -->
    <div class="input-wrapper">
      <form id="chat-form" class="floating-input" autocomplete="off">
        <input id="file-input" type="file" accept="image/*,.txt,.pdf,.docx" hidden />
        
        <button type="button" class="input-icon-btn" id="attach-btn" title="Attach File">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M21 11.5L12.5 20C10.6 21.9 7.5 21.9 5.6 20C3.7 18.1 3.7 15 5.6 13.1L14.1 4.6C15.4 3.3 17.5 3.3 18.8 4.6C20.1 5.9 20.1 8 18.8 9.3L10.6 17.5C9.9 18.2 8.8 18.2 8.1 17.5C7.4 16.8 7.4 15.7 8.1 15L15.5 7.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        
        <input id="chat-input" type="text" placeholder="Message Wazeer..." autocomplete="off" />
        
        <button type="submit" id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
      </form>
      <p class="disclaimer">Wazeer can make mistakes. Check important info.</p>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
