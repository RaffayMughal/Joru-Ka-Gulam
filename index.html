<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wazeer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-logo">
          <div class="logo-icon-w">W</div>
          <span class="logo-name">Wazeer</span>
        </div>
        <button class="icon-btn sidebar-menu-btn" title="Menu">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M9 3V21" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item" id="new-chat-nav">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>New Chat</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21L16.5 16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Search Chats</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M17 21V19C17 17.9391 16.5786 16.9217 15.8284 16.1716C15.0783 15.4214 14.0609 15 13 15H5C3.93913 15 2.92172 15.4214 2.17157 16.1716C1.42143 16.9217 1 17.9391 1 19V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M23 21V19C22.9993 18.1137 22.7044 17.2528 22.1614 16.5523C21.6184 15.8519 20.8581 15.3516 20 15.13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Community</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M16 18L22 12L16 6M8 6L2 12L8 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Coder</span>
        </button>
      </nav>

      <div class="sidebar-sections">
        <div class="section-header">
          <span>Projects</span>
          <button class="icon-btn-sm" title="New Project">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="section-empty">No projects yet</div>

        <div class="section-header"><span>All chats</span></div>

        <div class="section-header"><span>Today</span></div>
        <div id="conversation-list" class="conversation-list"></div>
      </div>

      <div class="sidebar-footer">
        <div class="user-avatar-circle">B</div>
        <span class="user-name-footer">Badshah</span>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- HEADER -->
      <header class="top-header">
        <div class="model-selector">
          <button class="model-btn" id="model-btn">
            <span id="model-name">Wazeer AI</span>
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="model-dropdown" id="model-dropdown">
            <div class="model-option active" data-model="wazeer-ai">Wazeer AI</div>
            <div class="model-option" data-model="wazeer-pro">Wazeer Pro</div>
            <div class="model-option" data-model="wazeer-lite">Wazeer Lite</div>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="theme-btn" title="Theme">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="notif-btn" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="menu-wrapper">
            <button class="icon-btn" id="menu-btn" title="More options">
              <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
            </button>
            <div class="context-menu" id="context-menu">
              <button class="menu-item"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg> Pin</button>
              <button class="menu-item"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 20h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Rename</button>
              <button class="menu-item"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.5"/></svg> Clone</button>
              <button class="menu-item"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M21 8V21H3V8M1 3H23V8H1V3ZM10 12H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Archive</button>
              <button class="menu-item"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M8.59 13.51L15.42 17.49M15.41 6.51L8.59 10.49" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Share</button>
              <button class="menu-item"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M21 15V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V15M7 10L12 15L17 10M12 15V3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Download</button>
              <button class="menu-item"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M3 7V17C3 18.1 3.9 19 5 19H19C20.1 19 21 18.1 21 17V7M3 7L12 13L21 7M3 7L12 1L21 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Move to Project</button>
              <button class="menu-item danger" id="menu-delete"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M4 7H20M9 7V4.5C9 4.22 9.22 4 9.5 4H14.5C14.78 4 15 4.22 15 4.5V7M18 7L17.3 18.3C17.25 19.25 16.45 20 15.5 20H8.5C7.55 20 6.75 19.25 6.7 18.3L6 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Delete</button>
              <button class="menu-item"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M4 15S1 12 1 9C1 6.5 3 4.5 5.5 4.5C7 4.5 8.5 5.5 9 7C9.5 5.5 11 4.5 12.5 4.5C15 4.5 17 6.5 17 9C17 12 14 15 14 15M12 15V20M9 20H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Report Content</button>
            </div>
          </div>
        </div>
      </header>

      <!-- CHAT AREA -->
      <div class="chat-area">
        <div class="welcome-screen" id="welcome-screen">
          <div class="welcome-logo">
            <div class="welcome-icon">W</div>
          </div>
          <h1 class="welcome-title">How can I help you?</h1>
        </div>

        <div id="chat-window" class="chat-window"></div>

        <div id="typing-indicator" class="typing-indicator hidden">
          <div class="avatar-circle bot-avatar">W</div>
          <div class="bubble typing-bubble"><span></span><span></span><span></span></div>
        </div>

        <div id="attachment-preview" class="attachment-preview hidden"></div>

        <div class="input-container">
          <form id="chat-form" class="chat-input-row" autocomplete="off">
            <input id="file-input" type="file" accept="image/*,.txt,.pdf,.docx" hidden />
            <button id="attach-btn" type="button" title="Attach">
              <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M21 11.5L12.5 20C10.6 21.9 7.5 21.9 5.6 20C3.7 18.1 3.7 15 5.6 13.1L14.1 4.6C15.4 3.3 17.5 3.3 18.8 4.6C20.1 5.9 20.1 8 18.8 9.3L10.6 17.5C9.9 18.2 8.8 18.2 8.1 17.5C7.4 16.8 7.4 15.7 8.1 15L15.5 7.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <input id="chat-input" type="text" placeholder="Ask Wazeer..." autocomplete="off" />
            <div class="input-right">
              <button type="button" class="auto-btn" id="auto-btn">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span>Auto</span>
              </button>
              <button id="send-btn" type="submit" title="Send">
                <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
              </button>
            </div>
          </form>
          <p class="disclaimer">AI-generated content may not be accurate.</p>
        </div>

        <div class="wave-bg">
          <svg viewBox="0 0 1440 200" preserveAspectRatio="none">
            <path d="M0,100 C360,180 720,20 1080,100 C1260,140 1380,80 1440,100 L1440,200 L0,200 Z" fill="rgba(6,182,212,0.08)"/>
            <path d="M0,140 C360,80 720,180 1080,120 C1260,90 1380,130 1440,120 L1440,200 L0,200 Z" fill="rgba(59,130,246,0.08)"/>
            <path d="M0,170 C360,140 720,190 1080,160 C1260,145 1380,170 1440,160 L1440,200 L0,200 Z" fill="rgba(139,92,246,0.08)"/>
          </svg>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
