<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wazeer</title>
<link rel="stylesheet" href="style.css?v=11" />
</head>
<body>

  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">W</div>
          <div class="logo-text">
            <h1>Wazeer</h1>
            <p class="logo-sub">AI Assistant</p>
          </div>
        </div>
        <button id="sidebar-close" class="icon-btn sidebar-close" type="button">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>

      <button id="new-chat-btn" class="new-chat-btn" type="button">
        <div class="new-chat-icon">+</div>
        <span>New Chat</span>
      </button>

      <div class="conv-section-label">
        <span>Recent Chats</span>
        <span class="conv-count" id="conv-count">0</span>
      </div>

      <div id="conversation-list" class="conversation-list"></div>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar-sidebar">B</div>
          <div class="user-info">
            <span class="user-name">Badshah</span>
            <span class="user-status"><span class="status-dot"></span> Online</span>
          </div>
        </div>
      </div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

    <div class="main-col">
      <header class="app-header">
        <button id="sidebar-toggle" class="icon-btn sidebar-toggle" type="button">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>

        <div class="logo-area">
          <div class="logo-icon-small">W</div>
          <div class="brand-text">
            <span class="brand-name">Wazeer</span>
            <span class="brand-sub">for Badshah</span>
          </div>
        </div>

        <div class="header-actions">
          <button id="theme-toggle" class="icon-btn theme-btn" type="button">
            <span class="theme-icon">☀️</span>
          </button>

          <div class="notif-wrapper">
            <button class="notif-btn" id="notif-btn" type="button">
              <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="notif-dot" id="notif-dot"></span>
            </button>
            <div class="notif-panel" id="notif-panel">
              <div class="notif-header">Notifications</div>
              <div class="notif-item">
                <div class="notif-icon">🚀</div>
                <div class="notif-text">
                  <div class="notif-title">Wazeer is live!</div>
                  <div class="notif-desc">Your AI assistant is ready.</div>
                </div>
              </div>
            </div>
          </div>

          <button id="clear-btn" class="clear-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
              <path d="M4 7H20M9 7V4.5C9 4.22386 9.22386 4 9.5 4H14.5C14.7761 4 15 4.22386 15 4.5V7M18 7L17.3 18.3C17.25 19.25 16.45 20 15.5 20H8.5C7.55 20 6.75 19.25 6.7 18.3L6 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Clear
          </button>
        </div>
      </header>

      <main class="chat-shell">
        <div id="chat-window" class="chat-window">
          <div class="message bot">
            <div class="avatar bot-avatar">W</div>
            <div class="bubble">
              <div class="bubble-text">Assalamu Alaikum Badshah! Main hoon Wazeer 🤖 Aap ka apna AI assistant.</div>
            </div>
          </div>
        </div>

        <div id="thinking-indicator" class="thinking-indicator hidden">
          <div class="avatar bot-avatar">W</div>
          <div class="thinking-bubble">
            <div class="thinking-label">
              <div class="thinking-spinner"></div>
              <span id="thinking-label-text">Thinking...</span>
            </div>
            <div class="thinking-steps" id="thinking-steps"></div>
          </div>
        </div>

        <div id="typing-indicator" class="typing-indicator hidden">
          <div class="avatar bot-avatar">W</div>
          <div class="bubble typing-bubble">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div id="attachment-preview" class="attachment-preview hidden"></div>

        <form id="chat-form" class="chat-input-row" autocomplete="off">
          <input id="file-input" type="file" accept="image/*,.txt,.pdf,.docx" hidden />
          <button id="attach-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
              <path d="M21 11.5L12.5 20C10.6 21.9 7.5 21.9 5.6 20C3.7 18.1 3.7 15 5.6 13.1L14.1 4.6C15.4 3.3 17.5 3.3 18.8 4.6C20.1 5.9 20.1 8 18.8 9.3L10.6 17.5C9.9 18.2 8.8 18.2 8.1 17.5C7.4 16.8 7.4 15.7 8.1 15L15.5 7.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" />
          <button id="send-btn" type="submit">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
              <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
          </button>
        </form>
      </main>
    </div>
  </div>

  <script>
    // Theme Toggle
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = themeBtn.querySelector('.theme-icon');
    const savedTheme = localStorage.getItem('wazeer_theme');

    if (savedTheme === 'light') {
      document.body.classList.add('light-mode');
      themeIcon.textContent = '🌙';
    }

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      themeIcon.textContent = isLight ? '' : '☀️';
      localStorage.setItem('wazeer_theme', isLight ? 'light' : 'dark');
    });

    // Notifications
    const notifBtn = document.getElementById('notif-btn');
    const notifPanel = document.getElementById('notif-panel');
    const notifDot = document.getElementById('notif-dot');
    
    notifBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      notifPanel.classList.toggle('open');
      if(notifPanel.classList.contains('open')) notifDot.style.display = 'none';
    });
    document.addEventListener('click', () => notifPanel.classList.remove('open'));
    notifPanel.addEventListener('click', (e) => e.stopPropagation());

    // Thinking Animation
    const THINKING_STEPS = ["Reading message", "Detecting language", "Forming response", "Almost ready"];
    let _tTimer = null;
    
    window.startThinking = function() {
      const ind = document.getElementById('thinking-indicator');
      const steps = document.getElementById('thinking-steps');
      const lbl = document.getElementById('thinking-label-text');
      document.getElementById('typing-indicator').classList.add('hidden');
      ind.classList.remove('hidden');
      steps.innerHTML = '';
      lbl.textContent = 'Thinking...';
      let i = 0;
      function add() {
        const prev = steps.querySelector('.thinking-step.active');
        if(prev) { prev.classList.remove('active'); prev.classList.add('done'); }
        if(i < THINKING_STEPS.length) {
          const s = document.createElement('div'); 
          s.className = 'thinking-step active'; 
          s.textContent = THINKING_STEPS[i];
          steps.appendChild(s); 
          i++; 
          _tTimer = setTimeout(add, 600);
        } else {
          lbl.textContent = 'Responding...';
          setTimeout(() => { 
            ind.classList.add('hidden'); 
            document.getElementById('typing-indicator').classList.remove('hidden'); 
          }, 400);
        }
      }
      add();
    };
    
    window.stopThinking = function() {
      clearTimeout(_tTimer);
      document.getElementById('thinking-indicator').classList.add('hidden');
      document.getElementById('typing-indicator').classList.add('hidden');
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
